# The Silesia corpus, twelve files assembled in 2002 to be the general purpose compression
# benchmark that the Calgary corpus had stopped being. Nothing here is text, or rather not only
# text: it is a database dump, an X-ray image, a star catalogue, a dictionary, source code, two
# binaries and three books, at sizes that were large when it was assembled and are small now.
#
# This is the first corpus in this repository that is mirrored rather than fetched, and the reason
# is the address. Its home has moved at least twice and the current one is a personal page on a
# university host, which is not a thing to build a decade of reproducibility on. The files are
# served from this repository's own release assets and their addresses are on the entries. The
# `source` field stays the place they came from, because that is the provenance, and a mirror that
# loses track of where the data came from is worse than a dead link.
#
# What is mirrored is exactly what silesia.zip contains, unpacked and otherwise untouched. Every
# file is the published size, which is the first thing that would have caught a bad unpack, and the
# total is 211,938,580 bytes.
#
# There is no [assertions] block. These are not tabular files, so there is no row or column count
# to assert, and the byte counts are the assertion.

[corpus]
name = "silesia"
description = "The Silesia compression corpus, twelve files of mixed real data from 2002"
source = "https://sun.aei.polsl.pl/~sdeor/corpus/silesia.zip"
licence = "Mixed, one set of terms per file, see the licence note"
category = "mirror"
licence_note = """
Silesia is published by Sebastian Deorowicz as a corpus for compression research and has been \
redistributed publicly since 2002. Its twelve files arrive under their own terms rather than one \
licence. dickens, reymont and webster are public domain texts. samba is Samba 2.2.3 source under \
GPL-2.0-or-later, and source is what is redistributed here. mozilla is a tar of Mozilla 1.0 \
executables under MPL-1.1, whose corresponding source for that release is still published by \
Mozilla, which is what MPL-1.1 asks of anybody redistributing the binaries. ooffice is a library \
from OpenOffice.org 1.01 under LGPL-2.1-or-later, on the same footing. mr, nci, osdb, sao, x-ray \
and xml are public scientific and reference data published for use. Every one of those permits \
redistribution unmodified, which is what happens here.
"""

