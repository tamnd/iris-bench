[workspace]
resolver = "3"
members = ["crates/*", "drivers/*"]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/iris-bench"
homepage = "https://github.com/tamnd/iris-bench"
authors = ["iris-bench contributors"]
keywords = ["benchmark", "columnar", "parquet", "reproducibility", "olap"]
categories = ["development-tools::profiling", "database"]
readme = "README.md"
publish = false

[workspace.dependencies]
bench-core = { path = "crates/bench-core", version = "0.2.4" }
bench-corpus = { path = "crates/bench-corpus", version = "0.2.4" }
bench-driver = { path = "crates/bench-driver", version = "0.2.4" }
bench-env = { path = "crates/bench-env", version = "0.2.4" }
bench-report = { path = "crates/bench-report", version = "0.2.4" }
bench-run = { path = "crates/bench-run", version = "0.2.4" }
bench-store = { path = "crates/bench-store", version = "0.2.4" }
bench-workload = { path = "crates/bench-workload", version = "0.2.4" }

anyhow = "1.0.104"
arrow-array = "59.3.0"
arrow-schema = "59.3.0"
blake3 = "1.8.7"
bytes = "1.12.1"
camino = "1.2.5"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
comfy-table = "8.0.0"
# Default features, which is what DataFusion's own benchmark entries build with. Arrow comes in
# through this rather than through the workspace's own arrow, so that a driver renders the arrays
# the engine actually produced instead of arrays from a second copy of Arrow.
datafusion = "55.0.0"
# Bundled on purpose. The version of a system under test belongs in the lockfile rather than in
# whatever each machine happened to have installed, because a version that varies by machine is a
# version nobody pinned and every result row carries it.
duckdb = { version = "1.10505.0", features = ["bundled"] }
flate2 = "1.1.10"
hdrhistogram = "7.6.0"
hex = "0.4.3"
indexmap = "2.14.2"
iris-source = "0.5.0"
jiff = "0.2.35"
libc = "0.2.189"
object_store = "0.14.1"
# Off by default so that a crate which only reads footers does not drag in every codec and the
# whole Arrow bridge. Anything that reads actual column data asks for what it needs.
parquet = { version = "59.3.0", default-features = false }
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
statrs = "0.19.1"
sysinfo = "0.39.6"
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
ureq = "3.4.0"
walkdir = "2.5.0"

insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
dbg_macro = "warn"
float_cmp = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
multiple_crate_versions = "allow"
todo = "warn"
undocumented_unsafe_blocks = "deny"

# A harness that measures other people's code has to be built the same way every
# time, or the harness becomes part of what is being measured.
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# DuckDB is bundled, which means its amalgamation gets compiled here, and at the dev profile's
# defaults that is about 2.7 GB of debug info per build fingerprint and a system under test compiled
# with no optimisation at all. Neither is any use. Nobody steps through DuckDB's internals in a
# debugger, they measure them, and an unoptimised DuckDB is not the DuckDB anyone runs.
[profile.dev.package.libduckdb-sys]
debug = false
opt-level = 2

[profile.test.package.libduckdb-sys]
debug = false
opt-level = 2

# No debug info for anything outside this workspace. The systems under test are large, DataFusion
# alone is a few hundred crates, and their debug info came to about 8 GB of a 13 GB target directory
# on a machine that then had no room to build anything else. Nobody sets a breakpoint inside a
# dependency here, they measure it, and our own crates keep their debug info so a panic in this
# repository still says which line it came from.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
